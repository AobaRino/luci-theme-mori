name: Build native SDK package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file curl openssl zstd xz-utils
      - name: Build and audit the native APK
        run: sh scripts/build-sdk.sh
      - name: Exercise native installation in an isolated rootfs
        run: sudo sh scripts/test-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: luci-theme-mori-native-sdk
          path: dist/sdk/
          if-no-files-found: error
          retention-days: 30
